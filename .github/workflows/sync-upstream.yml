name: Sync Upstream

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  # 必须保留：本 workflow 会 push main、force-push tag、删除 sync-conflict/* 分支
  # （实际凭据是 checkout 注入的 SYNC_PAT，但这一步的默认令牌仍要能写，
  # 否则任何未显式带凭据的 git 操作都会 403）。
  contents: write
  # 不需要 actions: write —— 这个 workflow 从不调用 Actions API（通知里那个运行链接
  # 只是个 URL 字符串）。多给一个写权限就多一个被滥用的面。
  # 清理步骤要查「这条分支上有没有还开着的 PR」，只读就够。
  pull-requests: read

# 同一时间只允许一个同步在跑：重叠的 schedule 或手动 dispatch 会争抢
# upstream/main 和 sync-conflict/* 分支。排队而非取消，避免半途中断。
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN is a GitHub App token and can never touch .github/workflows/.
          # Upstream changes ci.yml/release.yml, so pushing the merge needs a PAT
          # with the `workflow` scope (classic) or Workflows: write (fine-grained).
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git || true
          git fetch upstream main --tags --force

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_HEAD" = "$BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date with upstream/main."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in upstream/main."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          # 合并前的 HEAD 必须在**动工作区之前**取：自动解冲突那段会 git rm /
          # checkout / git add，一旦其中任何一步在 -e 下中断，恢复的目标 SHA 就
          # 没了。trap 也在这里就装好，而不是等到冲突分支里才装 —— 否则
          # 「自动解冲突成功但 git commit 失败」（没有内容可提交时 commit 会非零）
          # 这类路径会把仓库留在 MERGE_HEAD 未完成状态。
          # 成功路径要保留合并结果给后面的 Push updates 用，所以用 KEEP_WORKTREE 关掉恢复。
          BEFORE_SHA="$(git rev-parse HEAD)"
          KEEP_WORKTREE=0
          MANIFEST_DIR=""
          CONFLICTS_Z=""
          restore_worktree() {
            local rc=$?
            # 注意：这里不能写 `[ -n "$X" ] && rm ...`。变量为空时那个复合命令
            # 返回 1，在 set -e 下会当场终止 trap，后面的 reset 就被跳过了。
            if [ -n "${MANIFEST_DIR:-}" ]; then rm -rf "$MANIFEST_DIR" 2>/dev/null || true; fi
            if [ -n "${CONFLICTS_Z:-}" ]; then rm -f "$CONFLICTS_Z" 2>/dev/null || true; fi
            if [ "${KEEP_WORKTREE:-0}" = "1" ]; then
              return $rc
            fi
            # 除非明确保留（KEEP_WORKTREE=1 只在真正合并成功时设置），否则无条件恢复。
            # 原来只在「有 MERGE_HEAD」或「工作区脏」时才 reset，漏掉了第三种出口：
            # 交接提交已经建立、工作区干净、MERGE_HEAD 也已消失，但 HEAD 停在合并
            # 提交上（例如预置的同名本地分支让 `git branch` 失败，脚本 -e 退出）。
            # 那种情况工作区看着干净，HEAD 却不是 BEFORE_SHA —— 后面的步骤会拿它
            # 当合并结果去推。无条件 reset 是唯一不需要枚举出口的写法。
            if [ "$(git rev-parse HEAD 2>/dev/null || true)" != "$BEFORE_SHA" ] \
               || git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1 \
               || [ -n "$(git status --porcelain)" ]; then
              echo "::warning::提前退出，恢复到 ${BEFORE_SHA:0:12}"
              git reset --hard "$BEFORE_SHA" >/dev/null 2>&1 || true
              rm -f .sync-conflict.json
            fi
            return $rc
          }
          trap restore_worktree EXIT

          echo "Attempting to merge upstream/main..."
          if MERGE_ERR="$(git merge upstream/main --no-edit -m "chore: sync upstream changes" 2>&1)"; then
            echo "$MERGE_ERR"
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "merge_ok=true" >> $GITHUB_OUTPUT
            KEEP_WORKTREE=1
            echo "Merged upstream/main successfully."
          else
            # 合并失败有多种原因：真冲突、未跟踪文件冲突、无关历史等。
            # 输出 git 的原话，别让「merge 失败」变成没有下文的黑箱。
            echo "$MERGE_ERR"
            echo "Merge conflict detected. Checking conflicting files..."
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                *SponsorQuickStart*|*quickStart*|*QuickStart*|*sponsorQuickStart*)
                  # 赞助商卡片专属文件：直接强制删除，不保留任何版本
                  echo "Auto-discarding upstream sponsor component: $f"
                  git rm -f "$f" 2>/dev/null || true
                  ;;
                README.md|README_CN.md|assets/*|src/features/providers/ProvidersWorkbenchPage.*)
                  # 文档/广告图片/去广告核心页面：保留我方去广告版本
                  echo "Auto-resolving doc/ad conflict by keeping our clean version: $f"
                  git checkout --ours -- "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  ;;
              esac
            done

            # 冲突文件列表用 -z 取原始字节，避免 git 对特殊文件名输出的 C 风格引号
            # 污染后面的 JSON。人类可读的那份由 jq 组装。
            CONFLICTS_Z="$(mktemp)"
            git diff --name-only -z --diff-filter=U > "$CONFLICTS_Z"
            REMAINING_CONFLICTS="$(tr '\0' '\n' < "$CONFLICTS_Z" | tr '\n' ' ')"
            # 合并失败不只有「冲突」一种：无关历史、未跟踪文件挡住、磁盘/dirty index
            # 都会让 git merge 非零退出，但一个冲突文件都没有。区别很重要 ——
            # 「没有冲突文件的失败」不能交接（没有现场可看），也不该报成
            # 「存在冲突」让人去找不存在的冲突。merge_failed 单独标出来。
            if [ ! -s "$CONFLICTS_Z" ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              echo "::warning::git merge 失败但没有冲突文件（不是内容冲突），本次不做交接"
              echo "conflict=false" >> $GITHUB_OUTPUT
              echo "merge_failed=true" >> $GITHUB_OUTPUT
              echo "merge_ok=false" >> $GITHUB_OUTPUT
            elif [ ! -s "$CONFLICTS_Z" ]; then
              if git commit --no-edit -m "chore: sync upstream changes (auto-preserve ad-free docs/components)" >/tmp/commit-docs.log 2>&1; then
                echo "conflict=false" >> $GITHUB_OUTPUT
                echo "merge_ok=true" >> $GITHUB_OUTPUT
                KEEP_WORKTREE=1
                echo "All conflicts were in docs/ad files and auto-resolved successfully."
              else
                # 自动解完可能没有内容可提交（全部我方版本与上游一致）。这不代表
                # 合并成功也不能留下未完成的 MERGE_HEAD：汇报失败，让 trap 恢复。
                echo "::warning::文档/广告冲突自动处理后无法建立合并提交：$(tail -n 3 /tmp/commit-docs.log 2>/dev/null | tr '\n' ' ')"
                echo "conflict=false" >> $GITHUB_OUTPUT
                echo "merge_failed=true" >> $GITHUB_OUTPUT
                echo "merge_ok=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "conflict=true" >> $GITHUB_OUTPUT
              echo "merge_ok=false" >> $GITHUB_OUTPUT
              echo "conflict_files=$REMAINING_CONFLICTS" >> $GITHUB_OUTPUT
              echo "Unresolved code conflicts in: $REMAINING_CONFLICTS"

              # 冲突现场交给 Hermes 自动解决：先提交当前合并（保留两个父提交），
              # 再把提交推成一条可机读的分支，最后把工作区**真正**恢复到合并前。
              #
              # 四个要点，都是踩过的坑：
              #   1. 不能用 `git checkout -b` 再来 abort —— checkout 会清掉 MERGE_HEAD，
              #      之后 `git merge --abort` 只会报 "no merge to abort"，被 || true 吞掉，
              #      看着像回退了其实没有。这里用 `git reset --hard <before>`，必然生效。
              #   2. 去重键必须带**本地 HEAD**，不能只看 upstream SHA，也不能用 merge-base：
              #      merge-base(local, upstream) 只取决于上游历史，本地 main 前进不改变它，
              #      所以「upstream SHA + base_sha」在本地前进后仍然是同一个键 ——
              #      会命中陈旧分支，新冲突永远不交接。实测确认过。
              #   3. 交接提交里写一个 JSON，带 upstream/base/repo 三个 SHA 和结构化的
              #      冲突文件数组，外部（Hermes）不需要解析中文日志就能机读定位。
              #   4. JSON 必须由 jq 生成：git 对含引号/反斜杠的文件名会输出 C 风格转义，
              #      直接 printf 进 JSON 会产出非法文档（实测 JSON.parse 报错）。
              UPSTREAM_SHA="$(git rev-parse upstream/main)"
              BASE_SHA="$(git merge-base HEAD upstream/main)"
              TARGET_BRANCH="sync-conflict/${UPSTREAM_SHA:0:12}-${BEFORE_SHA:0:8}"
              MANIFEST_DIR="$(mktemp -d)"

              # 恢复逻辑只有一处，就是步骤开头装的 EXIT trap（BEFORE_SHA 也在那里取）。
              # 这里不再装第二个 trap —— bash 的 EXIT trap 是覆盖式的，装第二次会把
              # 恢复动作整个换掉。临时路径由上面那个 trap 统一清（用 ${X:-} 容错）。
              # 这段注释保留两次踩坑记录：
              #   A. jq 在运行时崩（不是缺失）时 `bash -e` 直接中断步骤，
              #      写在线性代码后面的 reset 永远执行不到，工作区留在冲突态；
              #   B. 进程替换里的内层 jq 失败不会让外层 jq 失败（pipefail 管不到
              #      process substitution），曾经产出 conflict_files:null 的假 manifest
              #      并照常推分支 —— 下游拿到「没有冲突」的现场，比不交接更难排查。

              # 生成并**校验**交接 manifest。拆成独立函数是因为它有两个必须
              # 单独失败的内部步骤，任何一步失败都不能让分支照推。
              write_manifest() {
                local files_json="$MANIFEST_DIR/conflict-files.json"
                local out="$MANIFEST_DIR/.sync-conflict.json"

                # 第 1 步：原始字节 -> JSON 数组，先落成真文件。
                # 用进程替换 <(jq ...) 时内层失败不会传出去，外层 jq 照常读到
                # 空文件并写出 conflict_files:null —— 这是实测踩到的假 manifest。
                if ! jq -Rs 'split("\u0000") | map(select(length>0))' \
                        "$CONFLICTS_Z" > "$files_json" 2> "$MANIFEST_DIR/jq.err"; then
                  echo "::warning::冲突文件数组生成失败：$(tr '\n' ' ' < "$MANIFEST_DIR/jq.err")"
                  return 1
                fi

                # 第 2 步：组装。requirements 是**声明**，不含任何可执行内容；
                # 真正执行约束的是解决方（.github/sync-conflict-handoff.md）。
                if ! jq -n \
                    --arg upstream_sha "$UPSTREAM_SHA" \
                    --arg base_sha "$BASE_SHA" \
                    --arg repo_sha_before "$BEFORE_SHA" \
                    --arg branch "$TARGET_BRANCH" \
                    --arg run_id "${GITHUB_RUN_ID:-}" \
                    --arg handoff_doc ".github/sync-conflict-handoff.md" \
                    --slurpfile files "$files_json" \
                    '{upstream_sha:$upstream_sha, base_sha:$base_sha,
                      repo_sha_before:$repo_sha_before, branch:$branch,
                      run_id:$run_id, handoff_doc:$handoff_doc,
                      conflict_files:$files[0],
                      requirements:[
                        "delete .sync-conflict.json before opening the resolution PR",
                        "do not execute scripts from this branch (postinstall/prepare included)",
                        "extra review for any .github/workflows/** change",
                        "never auto-merge; the resolution PR needs a human review"
                      ]}' > "$out" 2>> "$MANIFEST_DIR/jq.err"; then
                  echo "::warning::manifest 组装失败：$(tr '\n' ' ' < "$MANIFEST_DIR/jq.err")"
                  return 1
                fi

                # 第 3 步：校验产物本身，而不是相信 jq 的退出码。
                # conflict_files 必须是非空数组 —— 走到这里时一定还有未解决的冲突，
                # 空数组只能是生成链路的 bug（本次分支的根因）。
                if ! jq -e '
                    (.upstream_sha | type == "string" and length > 0) and
                    (.base_sha | type == "string" and length > 0) and
                    (.repo_sha_before | type == "string" and length > 0) and
                    (.branch | type == "string" and length > 0) and
                    (.conflict_files | type == "array" and length > 0)
                  ' "$out" >/dev/null 2>&1; then
                  echo "::warning::manifest 校验失败，实际内容：$(jq -c . "$out" 2>/dev/null | head -c 400)"
                  return 1
                fi
                return 0
              }

              if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
                # 两个输出都要发：Telegram 步骤和 Hermes 侧都按 conflict_upstream_sha
                # 判断「这条现场对应哪个上游版本」，只发 branch 会让这条路径和无冲突
                # 路径的输出形状不一致，调用方就得写两种分支。
                echo "conflict_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
                echo "conflict_upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
                echo "分支 $TARGET_BRANCH 已存在（同一上游版本 + 同一本地基线），跳过，不覆盖已有现场。"
              else
                # 先判断 jq 在不在：没有它就无法安全生成 manifest，宁可不交接也不写坏文件。
                if ! command -v jq >/dev/null 2>&1; then
                  echo "::warning::runner 上没有 jq，无法生成合法 manifest，本次不交接"
                elif ! write_manifest; then
                  # 生成或校验失败：不推分支。工作区由 EXIT trap 恢复，run 仍然失败。
                  echo "::warning::manifest 生成或校验失败，本次不交接"
                else
                  cp "$MANIFEST_DIR/.sync-conflict.json" .sync-conflict.json

                  if git add -A >/dev/null 2>&1 \
                     && git -c user.name="github-actions[bot]" \
                           -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                           commit -m "ci: sync-conflict handoff (upstream ${UPSTREAM_SHA:0:12})" >/tmp/commit.log 2>&1; then
                    MERGE_SHA="$(git rev-parse HEAD)"
                    # 用 git branch 指向合并提交，而不是 checkout 到它：checkout 会
                    # 清掉 MERGE_HEAD，交接提交就丢了上游那个父提交。
                    git branch "$TARGET_BRANCH" "$MERGE_SHA"
                    # 推送前先把 main 恢复干净；这里之后的任何失败都由 EXIT trap 收尾。
                    git reset --hard "$BEFORE_SHA" >/dev/null
                    if PUSH_ERR="$(git push origin "$TARGET_BRANCH" 2>&1)"; then
                      echo "conflict_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
                      echo "conflict_upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
                      echo "已将冲突现场推送到 $TARGET_BRANCH（合并父提交已保留），等待自动解决。"
                    else
                      echo "::warning::推送 $TARGET_BRANCH 失败：${PUSH_ERR}"
                      git branch -D "$TARGET_BRANCH" >/dev/null 2>&1 || true
                      echo "本地交接分支已清理，main 未受影响。"
                    fi
                  else
                    echo "::warning::无法建立交接提交：$(tail -n 3 /tmp/commit.log 2>/dev/null | tr '\n' ' ')"
                  fi
                fi
              fi
            fi
          fi

      - name: Align README Bun version with package.json
        # We keep our own READMEs, but upstream's tests/toolchainVersion.test.ts
        # asserts they state the pinned Bun release. Follow package.json so a
        # upstream bump does not break CI.
        #
        # 只认 merge_ok。原来判的是 conflict == 'false'，而 merge_failed 那条路径
        # 也输出 conflict=false —— 合并根本没成功，却会照常改 README 并提交，
        # 把失败伪装成一次正常同步。
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_ok == 'true'
        run: |
          BUN=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([0-9][0-9.]*\)".*/\1/p' package.json | head -n 1)
          if [ -z "$BUN" ]; then
            echo "::warning::No bun@X.Y.Z in packageManager; skipping README alignment."
            exit 0
          fi
          for f in README.md README_CN.md; do
            [ -f "$f" ] || continue
            if grep -q "\*\*Bun $BUN\*\*" "$f"; then
              echo "$f already states Bun $BUN."
              continue
            fi
            if grep -q '\*\*Bun [0-9][0-9.]*\*\*' "$f"; then
              perl -pi -e "s/\*\*Bun [0-9][0-9.]*\*\*/**Bun $BUN**/g" "$f"
              echo "Updated the Bun version in $f to $BUN."
              continue
            fi
            # No version line at all (upstream reworded it): write one, in the
            # Development section when it exists, at the end otherwise.
            if [ "$f" = "README.md" ]; then
              BUN_LINE="This project is built and tested with **Bun $BUN**, pinned in package.json and in CI."
              BUN_FALLBACK="**Bun $BUN** is the pinned toolchain for this project."
            else
              BUN_LINE="本项目使用 **Bun $BUN** 构建与测试，版本锁定在 package.json 与 CI 配置中。"
              BUN_FALLBACK="本项目使用 **Bun $BUN** 作为固定工具链。"
            fi
            export BUN_LINE BUN_FALLBACK
            perl -0pi -e 's/^(## (?:Development|开发命令)[^\n]*\n)/$1\n$ENV{BUN_LINE}\n/m' "$f"
            if ! grep -q "\*\*Bun $BUN\*\*" "$f"; then
              printf '\n%s\n' "$BUN_FALLBACK" >> "$f"
            fi
            echo "Added the Bun version line to $f."
          done
          if ! git diff --quiet -- README.md README_CN.md; then
            git add README.md README_CN.md
            git commit -m "docs(readme): follow the pinned Bun release"
          fi

      - name: Push updates
        # 只认 merge_ok（见 Align 那一步的注释）。这一条尤其重要：这一步会
        # `git tag -f` 把最新 v* tag 移到 HEAD 再 force-push，而 release.yml
        # 就是 `push: tags: v*` 触发的。合并没成功却跑到这里，等于用旧代码发版，
        # 且会把上游刚拉下来的新 tag 打到本地的旧 HEAD 上。
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_ok == 'true'
        run: |
          # 纵深防御：即使上面的门控被改坏，也不允许在不该发版的状态下移动 tag。
          # 走到这里但 HEAD 不含 upstream/main，说明 merge_ok 与仓库状态自相矛盾 ——
          # 我们并不知道 HEAD 是什么，所以什么都不推：**fail closed**。
          # 原来这里 push main 之后 exit 0，异常只会留在日志里；现在用 ::error::
          # 让 run 变红，并由 mgmt-ci-autofix 那条链去查。
          # 用 --verify：不带它时 `git rev-parse upstream/main` 在 ref 不存在时会把
          # 字面量 "upstream/main" 打到 stdout，`|| true` 又会吞掉非零退出码，
          # 于是变量非空、后面的报错信息还会打印半个 ref 名。
          UPSTREAM_SHA="$(git rev-parse --verify -q upstream/main 2>/dev/null || true)"
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::无法解析 upstream/main，拒绝推送（main 与 tag 都不动）"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "::error::HEAD 不包含 upstream/main（${UPSTREAM_SHA:0:12}），拒绝推送 main 与 tag 以避免误发 release"
            exit 1
          fi
          git push origin main
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "")
          if [ -n "$LATEST_TAG" ]; then
            # Force tag to point to the merge commit (not upstream's original commit)
            git tag -f "$LATEST_TAG" HEAD
            git push -f origin "refs/tags/${LATEST_TAG}"
          fi
          git push origin --tags --force

      - name: Prune obsolete sync-conflict branches
        # 按「可证状态」清理，不按天数：这些分支是未解决冲突的现场，本地没有副本，
        # 定时删除等于静默丢证据。只有下面三种状态之一成立时才删：
        #   1. 这条分支上的 PR 已合并（squash/rebase 合并也算，看 PR 状态而不是 git 祖先）
        #   2. 分支头已经在 origin/main 里（fast-forward / merge commit 合并）
        #   3. 分支对应的上游 SHA 已经在 origin/main 里（main 已被更新的同步追上）
        # 其余一律保留，并在 run summary 里列出来，避免「不知道还有几条待处理」。
        #
        # 两条优先级规则，顺序不能换：
        #   * 有 open PR 的分支永不删 —— 分支上可能同时存在「旧 PR 已合并」和
        #     「新 PR 打开」，先判 merged 会把它删掉，正在解决的人失去现场。
        #   * 查询失败按「未知」处理并保留（fail closed）。把失败当成「没有 PR」，
        #     再叠加「分支头已在 main」就会误删一条有 open PR 的分支。
        #
        # 用 !cancelled() 而不是 always()：取消的 run 不该动远端分支。
        if: ${{ !cancelled() }}
        env:
          # pull-requests: read 只作用于 GITHUB_TOKEN，对自己签发的 PAT 无效。
          # PR 查询走 GITHUB_TOKEN（有本文件声明的权限）；删除分支走 git push，
          # 用的是 checkout 注入的 SYNC_PAT 凭据，不需要 GH_TOKEN。
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 这个 step 用 !cancelled() 而不是 only-on-success，所以前一步可能没跑完。
          # 先确认仓库可用；不可用就直接退出，绝不在半成品状态下删分支。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::没有可用的 git 仓库，跳过分支清理"
            exit 0
          fi

          # 一次 fetch 覆盖所有分支：分支列表和 tip 都取自同一份 remote-tracking ref，
          # 不会出现「ls-remote 里有、本地 ref 没有」的错位（那种错位会走到
          # TIP 为空的分支，白白把可清理的分支留到下一轮）。
          if ! git fetch origin --prune --quiet; then
            echo "::warning::fetch 失败，状态不可信，本轮不清理"
            exit 0
          fi

          BRANCHES="$(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/sync-conflict/ || true)"
          if [ -z "$BRANCHES" ]; then
            echo "没有 sync-conflict/* 分支，无需清理。"
            exit 0
          fi

          declare -a KEPT=() DELETED=() REMOVED=() FAILED=()

          # gh 的 stdout / stderr 必须分开接：混在一起会让错误文本被当成查询结果
          # （"rate limit 403" 里那个 403 会被数成一条 PR，直接导致误删分支）。
          GH_OUT="$(mktemp)"
          GH_ERR="$(mktemp)"
          MERGED_OUT="$(mktemp)"
          MERGED_ERR="$(mktemp)"
          trap 'rm -f "$GH_OUT" "$GH_ERR" "$MERGED_OUT" "$MERGED_ERR" 2>/dev/null || true' EXIT

          # 数组条目用 **制表符** 分隔，不用 `|`：原因里会贴 gh 的错误文本，
          # 那里面常有竖线，用 `|` 当分隔符会把原因截断。
          #
          # 写进 Markdown 表格前要把表格元字符转义：
          #   |  拆列
          #   \  本身也要先转，否则新加的转义符会叠加
          #   <  被当成 HTML 标签起始，表格内容会消失
          #   * _ 在「状态」列里会被解析成强调（`a*b*c` 里 b 变斜体），
          #       分支名在代码 span 里不受影响，但原因文本是普通文本。
          md_escape() {
            printf '%s' "$1" | tr '\n\t' '  ' \
              | sed -e 's/\\/\\\\/g' -e 's/|/\\|/g' -e 's/</\\</g' -e 's/\*/\\*/g' -e 's/_/\\_/g'
          }
          # 行内代码里**不能**用反斜杠转义反引号：代码 span 内的 `\` 是字面量，
          # 反引号会立刻闭合 span（实测 `x\`y` 渲染坏掉）。
          # 正确做法是加长分隔符：找出内容里最长的连续反引号串（长度 N），
          # 用 N+1 个反引号做定界符，首尾各留一个空格（CommonMark 规则）。
          # 固定用两个反引号在遇到 ``a`` 这种连续两个时仍然会破。
          code_span() {
            local s="$1" n=0 run=0 ch i
            local len=${#s}
            for ((i = 0; i < len; i++)); do
              ch="${s:i:1}"
              if [ "$ch" = '`' ]; then
                run=$((run + 1))
                [ "$run" -gt "$n" ] && n=$run
              else
                run=0
              fi
            done
            if [ "$n" -eq 0 ]; then
              printf '`%s`' "$s"
              return
            fi
            local fence
            fence="$(printf '%*s' $((n + 1)) '' | tr ' ' '`')"
            printf '%s %s %s' "$fence" "$s" "$fence"
          }
          row() {
            local branch reason tag
            branch="$(code_span "$(md_escape "$1")")"
            reason="$(md_escape "$2")"
            tag="$3"
            printf '| %s | %s：%s |\n' "$branch" "$tag" "$reason"
          }

          # 数字校验：gh 成功但输出不是数字（被改动过的响应）也算未知。
          is_count() {
            case "$1" in
              ''|*[!0-9]*) return 1 ;;
            esac
            return 0
          }

          # 判断合并树里某个文件的状态（区分「未解现场」和「已解成果」）：
          #   0 = 仍含完整冲突块（^<<<<<<< 且 ^>>>>>>>）
          #   1 = 无完整冲突块（已解；单独的 ======= 或 <<<<<<< 不算）
          #   2 = 路径不存在（解冲突时删除，属成果）
          #   3 = 查询错误（调用方 fail closed）
          file_state() {
            local c="$1" fn="$2" rc content
            if git rev-parse --verify -q "$c:$fn" >/dev/null 2>&1; then
              :
            else
              rc=$?
              if [ "$rc" -eq 1 ]; then
                return 2
              fi
              return 3
            fi
            if ! content="$(git show "$c:$fn" 2>/dev/null)"; then
              return 3
            fi
            if printf '%s\n' "$content" | grep -q '^<<<<<<< ' \
               && printf '%s\n' "$content" | grep -q '^>>>>>>> '; then
              return 0
            fi
            return 1
          }

          while IFS= read -r b; do
            [ -z "$b" ] && continue

            # 第 1 步：有 open PR 就保留 —— 必须排在 merged 之前。
            if ! gh api "repos/$REPO/pulls?state=open&head=$OWNER:$b&per_page=1" \
                 --jq 'length' > "$GH_OUT" 2> "$GH_ERR"; then
              KEPT+=("$b"$'\t'"PR 状态未知（open 查询失败），按保留处理：$(head -c 200 "$GH_ERR")")
              continue
            fi
            OPEN_COUNT="$(tr -d '\n' < "$GH_OUT")"
            if ! is_count "$OPEN_COUNT"; then
              KEPT+=("$b"$'\t'"PR 状态未知（open 输出异常：$(head -c 80 "$GH_OUT")），按保留处理")
              continue
            fi
            if [ "$OPEN_COUNT" -gt 0 ]; then
              KEPT+=("$b"$'\t'"有 open PR")
              continue
            fi

            # 第 2 步：确认存在已合并的 PR。
            # 用 --paginate + 逐条输出再计数，而不是只取一页：同一分支被反复
            # 用作交接分支时 closed PR 可能超过 100 条，「第 101 条才是 merged」
            # 就会漏判。gh 2.46 没有 --slurp，所以让 --jq 每条输出一行再本地数。
            if ! gh api "repos/$REPO/pulls?state=closed&head=$OWNER:$b&per_page=100" \
                 --paginate \
                 --jq '.[] | select(.merged_at != null) | .number' \
                 > "$MERGED_OUT" 2> "$MERGED_ERR"; then
              KEPT+=("$b"$'\t'"PR 状态未知（merged 查询失败），按保留处理：$(head -c 200 "$MERGED_ERR")")
              continue
            fi
            MERGED_COUNT="$(wc -l < "$MERGED_OUT" | tr -d ' ')"
            if ! is_count "$MERGED_COUNT"; then
              KEPT+=("$b"$'\t'"PR 状态未知（merged 输出异常），按保留处理")
              continue
            fi
            if [ "$MERGED_COUNT" -gt 0 ]; then
              DELETED+=("$b"$'\t'"PR merged")
              continue
            fi

            # 第 3 步：没有 PR 记录，退回 git 状态判断。
            TIP="$(git rev-parse "refs/remotes/origin/$b" 2>/dev/null || true)"
            if [ -z "$TIP" ]; then
              KEPT+=("$b"$'\t'"本地无该 ref，无法判断")
              continue
            fi
            if git merge-base --is-ancestor "$TIP" refs/remotes/origin/main 2>/dev/null; then
              DELETED+=("$b"$'\t'"contained in main")
              continue
            fi

            # manifest 里的 upstream_sha 进了 main，只能说明「上游那半个现场已经
            # 跟上了」，**不能**说明这条分支上的解冲突成果已经进 main。
            # 实测两个反例，都真丢数据：
            #   a) 分支上有唯一的解冲突**普通提交**；
            #   b) 解冲突结果被 --amend 折进了**交接 merge 自己**（两个父提交都已在
            #      main，唯一内容就是那个 merge 的 diff）。
            # 所以规则 3 必须再加一条：分支相对 main 没有独有内容。
            MANIFEST_JSON="$(git show "refs/remotes/origin/$b:.sync-conflict.json" 2>/dev/null || true)"
            UP="$(printf '%s' "$MANIFEST_JSON" | jq -r '.upstream_sha // empty' 2>/dev/null || true)"
            CONFLICT_FILES="$(printf '%s' "$MANIFEST_JSON" | jq -r '.conflict_files[]? // empty' 2>/dev/null || true)"
            if [ -z "$UP" ]; then
              UP="$(git rev-parse --verify -q "$TIP^2" 2>/dev/null || true)"
            fi
            if [ -n "$UP" ] && git merge-base --is-ancestor "$UP" refs/remotes/origin/main 2>/dev/null; then
              # 统计「分支相对 main 还带着的实质内容」。必须**包含合并提交**：
              # `--no-merges` 会把交接 merge 整个剔掉，而解冲突结果可能就在它里面
              # （--amend 折进去的常见形态）。同时不能用 `git show --name-only`
              # 判断合并提交的内容 —— 它对 merge 打印的是相对第一父的整份差异，
              # 纯交接 merge 也会列出上游改过的所有文件。正确判据是
              # `git diff-tree -c`（combined diff）：只列出该 merge 相对**两个**
              # 父提交都不同的路径，即「只有这个 merge 才有的解冲突结果」。
              #
              # 但「combined diff 非空」还不足以判定它是真实成果：**未解决的**交接
              # merge 的 tree 里留着 `<<<<<<<` 标记，combined diff 同样非空。两种
              # 形态在 diff 层面无法区分，实测：
              #   真冲突未解决  -> tree 含 markers，diff-tree -c = [f.txt]
              #   已解冲突成 Z  -> tree 是内容，diff-tree -c = [f.txt]
              # 所以对合并提交要多看一步：它改动过的文件里，是否还留着冲突标记。
              # 全都还带标记 = 纯交接现场（没有产出），跳过；
              # 有任何文件已经没有标记 = 里面有人做过的决定，必须计入。
              # fail closed：rev-list 失败时不能当成「没有独有提交」然后删分支。
              if ! COMMITS="$(git rev-list "$TIP" --not refs/remotes/origin/main 2>/dev/null)"; then
                KEPT+=("$b"$'\t'"upstream 已在 main，但无法枚举分支提交，按保留处理")
                continue
              fi

              UNIQUE_TREE=0
              SCAN_FAILED=0
              while IFS= read -r c; do
                [ -z "$c" ] && continue
                # fail closed：下面每个 git 查询失败都保留分支，不能当成「没有独有内容」
                if ! PARENTS="$(git rev-list --parents -n1 "$c" 2>/dev/null)"; then
                  SCAN_FAILED=1
                  break
                fi
                read -r _csha _p1 p2 _rest <<< "$PARENTS"
                if [ -n "${p2:-}" ]; then
                  if ! own="$(git diff-tree -c --no-commit-id --name-only -r "$c" 2>/dev/null)"; then
                    SCAN_FAILED=1
                    break
                  fi
                  own="$(printf '%s\n' "$own" | sed '/^$/d')"
                  if [ -z "$own" ]; then
                    # 没有自己的改动 = 纯交接 merge（上游那一半），跳过
                    continue
                  fi
                  # 有改动：逐个文件判断是否仍是「未解现场」。
                  # 只有完整冲突块（<<<<<<< + >>>>>>>）才算未解；
                  # 单独的 =======（Markdown Setext）或 <<<<<<< 示例不算。
                  resolved=0
                  while IFS= read -r fn; do
                    [ -z "$fn" ] && continue
                    case "$fn" in .sync-conflict.json) continue ;; esac
                    if file_state "$c" "$fn"; then fs=0; else fs=$?; fi
                    case "$fs" in
                      1|2) resolved=1 ;;
                      3) SCAN_FAILED=1; break 2 ;;
                    esac
                  done <<< "$own"
                  # take-ours 形态：结果等于某一父，diff-tree -c 不会列出该文件。
                  # 用 manifest 的 conflict_files 再逐文件核对 merge tree。
                  if [ "$resolved" -eq 0 ] && [ -n "$CONFLICT_FILES" ]; then
                    while IFS= read -r fn; do
                      [ -z "$fn" ] && continue
                      if file_state "$c" "$fn"; then fs=0; else fs=$?; fi
                      case "$fs" in
                        1|2) resolved=1; break ;;
                        3) SCAN_FAILED=1; break 2 ;;
                      esac
                    done <<< "$CONFLICT_FILES"
                  fi
                  if [ "$resolved" -gt 0 ]; then
                    UNIQUE_TREE=$((UNIQUE_TREE + 1))
                  fi
                else
                  # 普通提交：只改 .sync-conflict.json 的属于交接产物，跳过
                  if ! files="$(git show --pretty=format: --name-only "$c" 2>/dev/null)"; then
                    SCAN_FAILED=1
                    break
                  fi
                  files="$(printf '%s\n' "$files" | sed '/^$/d')"
                  if [ -z "$files" ]; then
                    # 空提交没有实质内容
                    continue
                  fi
                  # 区分 grep 的 exit 1（没有非 manifest 文件，正常）和 2/127（错误）
                  if FILTERED="$(printf '%s\n' "$files" | grep -v '^\.sync-conflict\.json$')"; then
                    GREP_RC=0
                  else
                    GREP_RC=$?
                  fi
                  if [ "$GREP_RC" -eq 1 ]; then
                    continue
                  fi
                  if [ "$GREP_RC" -ne 0 ]; then
                    SCAN_FAILED=1
                    break
                  fi
                  if [ -z "$FILTERED" ]; then
                    continue
                  fi
                  UNIQUE_TREE=$((UNIQUE_TREE + 1))
                fi
              done <<< "$COMMITS"

              if [ "$SCAN_FAILED" = 1 ]; then
                KEPT+=("$b"$'\t'"upstream 已在 main，但扫描分支提交失败，按保留处理")
                continue
              fi

              if [ "$UNIQUE_TREE" -gt 0 ]; then
                KEPT+=("$b"$'\t'"upstream $(echo "$UP" | cut -c1-12) 已在 main，但分支还有 $UNIQUE_TREE 个独有提交")
                continue
              fi
              DELETED+=("$b"$'\t'"upstream $(echo "$UP" | cut -c1-12) 已在 main，且只剩交接提交")
              continue
            fi

            KEPT+=("$b"$'\t'"pending")
          done <<< "$BRANCHES"

          for entry in "${DELETED[@]:-}"; do
            [ -z "$entry" ] && continue
            b="${entry%%$'\t'*}"
            why="${entry#*$'\t'}"
            if git push origin --delete "$b" >/dev/null 2>&1; then
              REMOVED+=("$entry")
              echo "已删除 $b（$why）"
            else
              # 只进 FAILED，不再同时留在 DELETED —— 否则 summary 会同一分支
              # 出现「已删除」和「保留」两行，读起来像删了又留。
              FAILED+=("$entry")
              echo "::warning::删除 $b 失败（$why），保留待下次重试"
            fi
          done

          {
            echo "### sync-conflict/* 分支状态"
            echo
            echo "| 分支 | 状态 |"
            echo "| --- | --- |"
            for entry in "${KEPT[@]:-}"; do
              [ -z "$entry" ] && continue
              row "${entry%%$'\t'*}" "${entry#*$'\t'}" "保留"
            done
            for entry in "${REMOVED[@]:-}"; do
              [ -z "$entry" ] && continue
              row "${entry%%$'\t'*}" "${entry#*$'\t'}" "已删除"
            done
            for entry in "${FAILED[@]:-}"; do
              [ -z "$entry" ] && continue
              row "${entry%%$'\t'*}" "${entry#*$'\t'}" "删除失败，保留"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # 有分支该删没删掉，说明凭据或网络有问题；让 run 可见，但不影响
          # 同步本身的结果（同步已经在前面成功了）。
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::warning::${#FAILED[@]} 条过期分支删除失败，下一轮会重试"
          fi

      - name: Send Telegram notification on conflict
        # 条件是「有上游更新，且没有成功合并」。三种失败形态都要通知：
        #   conflict == 'true'          真冲突（是否已交接看 CONFLICT_BRANCH）
        #   merge_failed == 'true'      merge 被拒绝但没有冲突文件（无关历史等）
        #   outcome == 'failure'        步骤本身崩了，没来得及写输出
        # 原来只判 conflict == 'true'，于是第三种被完全跳过 —— 正是最该告警的情况。
        if: ${{ !cancelled() && steps.check.outputs.has_updates == 'true' && (steps.merge.outputs.conflict == 'true' || steps.merge.outputs.merge_failed == 'true' || steps.merge.outcome == 'failure') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          CONFLICT_BRANCH: ${{ steps.merge.outputs.conflict_branch }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          MERGE_FAILED: ${{ steps.merge.outputs.merge_failed }}
        run: |
          # 冲突现场已推成分支时，说明已交给自动解决流程，不再重复喊「请手动解决」。
          # 注意「工作区已恢复」这句话不能无条件写：MERGE_OUTCOME=failure 时脚本可能在
          # 任何位置中断（甚至 git reset 自己都失败），说「已被兜底恢复」是不准的。
          if [ -n "${CONFLICT_BRANCH:-}" ]; then
            STATUS_LINE="*状态:* 冲突已推送到分支 \`${CONFLICT_BRANCH}\`，交由自动解决流程处理。"
            ACTION_LINE="若自动修复未开 PR，请检查分支 \`${CONFLICT_BRANCH}\`。"
          elif [ "${MERGE_OUTCOME:-}" = "failure" ]; then
            # 步骤崩了但没有 conflict 输出：不是「解完了」，是没跑完。
            STATUS_LINE="*状态:* 合并步骤异常中止，没有产生交接分支。"
            ACTION_LINE="看运行日志确认是 jq/磁盘/凭据哪一步；工作区可能没恢复，下一轮 run 前留意。"
          elif [ "${MERGE_FAILED:-}" = "true" ]; then
            # merge 非零退出但没有任何冲突文件：不是内容冲突，别让人去找不存在的冲突。
            STATUS_LINE="*状态:* git merge 被拒绝（无冲突文件），本次同步未完成。"
            ACTION_LINE="多为无关历史或未跟踪文件挡住，看日志里的 git 原话。"
          else
            STATUS_LINE="*状态:* 自动合并失败，存在冲突！"
            ACTION_LINE="请及时拉取仓库手动解决冲突。"
          fi

          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            # 冲突文件名可能含 `|`、`*`、`_`、`` ` ``，直接塞进 Markdown（parse_mode=Markdown）
            # 会：1) 在表格式排版里把行拆成多列；2) 被解析成斜体/代码而变形。
            # 这里把 Markdown 有三个特殊意义的字符转义，并统一换行折叠成空格。
            # 转义顺序：先 `\` 再 `|`、`*`、`_`、`` ` ``，避免把刚加的 `\` 再转一次。
            SAFE_FILES="$(printf '%s' "${CONFLICT_FILES:-（无 / 步骤未产出）}" \
              | tr '\n' ' ' \
              | sed -e 's/\\/\\\\/g' -e 's/|/\\|/g' -e 's/\*/\\*/g' -e 's/_/\\_/g' -e 's/`/\\`/g')"
            TEXT=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n```\n%s\n```\n\n%s\n\n%s' \
              "⚠️ *Cli-Proxy-API-Management-Center 同步冲突告警*" \
              "*仓库:* \`${{ github.repository }}\`" \
              "*上游:* \`router-for-me/Cli-Proxy-API-Management-Center\` (main)" \
              "$STATUS_LINE" \
              "*冲突文件列表:*" \
              "$SAFE_FILES" \
              "🔗 [点击查看 GitHub Action 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              "$ACTION_LINE")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -d "parse_mode=Markdown")
            echo "Telegram API Response: ${RESPONSE}"
            # 通知失败不应该冒充「同步失败」：这里不打 exit 1，最终退出码由下面的
            # 冲突语义决定。真正的凭据问题已经在上面 ::warning:: 里写过。
          else
            echo "::warning::TG_BOT_TOKEN (or TELEGRAM_BOT_TOKEN) / TG_CHAT_ID (or TELEGRAM_CHAT_ID) is not configured in repository secrets."
          fi
          # 冲突（或合并步骤异常）是真实状态，run 必须红：main 没有收到这次同步。
          exit 1
