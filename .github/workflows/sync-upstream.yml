name: Sync Upstream

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN is a GitHub App token and can never touch .github/workflows/.
          # Upstream changes ci.yml/release.yml, so pushing the merge needs a PAT
          # with the `workflow` scope (classic) or Workflows: write (fine-grained).
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git || true
          git fetch upstream main --tags --force

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_HEAD" = "$BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date with upstream/main."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in upstream/main."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          echo "Attempting to merge upstream/main..."
          if git merge upstream/main --no-edit -m "chore: sync upstream changes"; then
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "Merged upstream/main successfully."
          else
            echo "Merge conflict detected. Checking conflicting files..."
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                *SponsorQuickStart*|*quickStart*|*QuickStart*|*sponsorQuickStart*)
                  # 赞助商卡片专属文件：直接强制删除，不保留任何版本
                  echo "Auto-discarding upstream sponsor component: $f"
                  git rm -f "$f" 2>/dev/null || true
                  ;;
                README.md|README_CN.md|assets/*|src/features/providers/ProvidersWorkbenchPage.tsx)
                  # 文档/广告图片/去广告核心页面：保留我方去广告版本
                  echo "Auto-resolving doc/ad conflict by keeping our clean version: $f"
                  git checkout --ours -- "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  ;;
              esac
            done

            REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -z "$REMAINING_CONFLICTS" ]; then
              git commit --no-edit -m "chore: sync upstream changes (auto-preserve ad-free docs/components)"
              echo "conflict=false" >> $GITHUB_OUTPUT
              echo "All conflicts were in docs/ad files and auto-resolved successfully."
            else
              echo "conflict=true" >> $GITHUB_OUTPUT
              echo "conflict_files=$REMAINING_CONFLICTS" >> $GITHUB_OUTPUT
              echo "Unresolved code conflicts in: $REMAINING_CONFLICTS"
              git merge --abort || true
            fi
          fi

      - name: Align README Bun version with package.json
        # We keep our own READMEs, but upstream's tests/toolchainVersion.test.ts
        # asserts they state the pinned Bun release. Follow package.json so a
        # upstream bump does not break CI.
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          BUN=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([0-9][0-9.]*\)".*/\1/p' package.json | head -n 1)
          if [ -z "$BUN" ]; then
            echo "::warning::No bun@X.Y.Z in packageManager; skipping README alignment."
            exit 0
          fi
          for f in README.md README_CN.md; do
            [ -f "$f" ] || continue
            if grep -q "\*\*Bun $BUN\*\*" "$f"; then
              echo "$f already states Bun $BUN."
              continue
            fi
            if grep -q '\*\*Bun [0-9][0-9.]*\*\*' "$f"; then
              perl -pi -e "s/\*\*Bun [0-9][0-9.]*\*\*/**Bun $BUN**/g" "$f"
              echo "Updated the Bun version in $f to $BUN."
              continue
            fi
            # No version line at all (upstream reworded it): write one, in the
            # Development section when it exists, at the end otherwise.
            if [ "$f" = "README.md" ]; then
              BUN_LINE="This project is built and tested with **Bun $BUN**, pinned in package.json and in CI."
              BUN_FALLBACK="**Bun $BUN** is the pinned toolchain for this project."
            else
              BUN_LINE="本项目使用 **Bun $BUN** 构建与测试，版本锁定在 package.json 与 CI 配置中。"
              BUN_FALLBACK="本项目使用 **Bun $BUN** 作为固定工具链。"
            fi
            export BUN_LINE BUN_FALLBACK
            perl -0pi -e 's/^(## (?:Development|开发命令)[^\n]*\n)/$1\n$ENV{BUN_LINE}\n/m' "$f"
            if ! grep -q "\*\*Bun $BUN\*\*" "$f"; then
              printf '\n%s\n' "$BUN_FALLBACK" >> "$f"
            fi
            echo "Added the Bun version line to $f."
          done
          if ! git diff --quiet -- README.md README_CN.md; then
            git add README.md README_CN.md
            git commit -m "docs(readme): follow the pinned Bun release"
          fi

      - name: Push updates
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          git push origin main
          git push origin --tags --force

      - name: Trigger Release Build
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "")
          echo "Triggering release build for tag: ${LATEST_TAG:-latest}..."
          if [ -n "$LATEST_TAG" ]; then
            gh workflow run release.yml --repo "$GH_REPO" -f tag_name="$LATEST_TAG"
          else
            gh workflow run release.yml --repo "$GH_REPO"
          fi

      - name: Send Telegram notification on conflict
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            TEXT=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n```\n%s\n```\n\n%s\n\n%s' \
              "⚠️ *Cli-Proxy-API-Management-Center 同步冲突告警*" \
              "*仓库:* \`${{ github.repository }}\`" \
              "*上游:* \`router-for-me/Cli-Proxy-API-Management-Center\` (main)" \
              "*状态:* 自动合并失败，存在冲突！" \
              "*冲突文件列表:*" \
              "${CONFLICT_FILES}" \
              "🔗 [点击查看 GitHub Action 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              "请及时拉取仓库手动解决冲突。")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -d "parse_mode=Markdown")
            echo "Telegram API Response: ${RESPONSE}"
          else
            echo "::warning::TG_BOT_TOKEN (or TELEGRAM_BOT_TOKEN) / TG_CHAT_ID (or TELEGRAM_CHAT_ID) is not configured in repository secrets."
          fi
          exit 1
