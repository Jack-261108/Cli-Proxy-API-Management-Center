name: Sync Upstream

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # 清理步骤要查「这条分支上有没有还开着的 PR」，只读就够。
  pull-requests: read

# 同一时间只允许一个同步在跑：重叠的 schedule 或手动 dispatch 会争抢
# upstream/main 和 sync-conflict/* 分支。排队而非取消，避免半途中断。
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN is a GitHub App token and can never touch .github/workflows/.
          # Upstream changes ci.yml/release.yml, so pushing the merge needs a PAT
          # with the `workflow` scope (classic) or Workflows: write (fine-grained).
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git || true
          git fetch upstream main --tags --force

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_HEAD" = "$BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date with upstream/main."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in upstream/main."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          echo "Attempting to merge upstream/main..."
          if MERGE_ERR="$(git merge upstream/main --no-edit -m "chore: sync upstream changes" 2>&1)"; then
            echo "$MERGE_ERR"
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "Merged upstream/main successfully."
          else
            # 合并失败有多种原因：真冲突、未跟踪文件冲突、无关历史等。
            # 输出 git 的原话，别让「merge 失败」变成没有下文的黑箱。
            echo "$MERGE_ERR"
            echo "Merge conflict detected. Checking conflicting files..."
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                *SponsorQuickStart*|*quickStart*|*QuickStart*|*sponsorQuickStart*)
                  # 赞助商卡片专属文件：直接强制删除，不保留任何版本
                  echo "Auto-discarding upstream sponsor component: $f"
                  git rm -f "$f" 2>/dev/null || true
                  ;;
                README.md|README_CN.md|assets/*|src/features/providers/ProvidersWorkbenchPage.*)
                  # 文档/广告图片/去广告核心页面：保留我方去广告版本
                  echo "Auto-resolving doc/ad conflict by keeping our clean version: $f"
                  git checkout --ours -- "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  ;;
              esac
            done

            # 冲突文件列表用 -z 取原始字节，避免 git 对特殊文件名输出的 C 风格引号
            # 污染后面的 JSON。人类可读的那份由 jq 组装。
            CONFLICTS_Z="$(mktemp)"
            git diff --name-only -z --diff-filter=U > "$CONFLICTS_Z"
            REMAINING_CONFLICTS="$(tr '\0' '\n' < "$CONFLICTS_Z" | tr '\n' ' ')"
            if [ ! -s "$CONFLICTS_Z" ]; then
              git commit --no-edit -m "chore: sync upstream changes (auto-preserve ad-free docs/components)"
              echo "conflict=false" >> $GITHUB_OUTPUT
              echo "All conflicts were in docs/ad files and auto-resolved successfully."
            else
              echo "conflict=true" >> $GITHUB_OUTPUT
              echo "conflict_files=$REMAINING_CONFLICTS" >> $GITHUB_OUTPUT
              echo "Unresolved code conflicts in: $REMAINING_CONFLICTS"

              # 冲突现场交给 Hermes 自动解决：先提交当前合并（保留两个父提交），
              # 再把提交推成一条可机读的分支，最后把工作区**真正**恢复到合并前。
              #
              # 四个要点，都是踩过的坑：
              #   1. 不能用 `git checkout -b` 再来 abort —— checkout 会清掉 MERGE_HEAD，
              #      之后 `git merge --abort` 只会报 "no merge to abort"，被 || true 吞掉，
              #      看着像回退了其实没有。这里用 `git reset --hard <before>`，必然生效。
              #   2. 去重键必须带**本地 HEAD**，不能只看 upstream SHA，也不能用 merge-base：
              #      merge-base(local, upstream) 只取决于上游历史，本地 main 前进不改变它，
              #      所以「upstream SHA + base_sha」在本地前进后仍然是同一个键 ——
              #      会命中陈旧分支，新冲突永远不交接。实测确认过。
              #   3. 交接提交里写一个 JSON，带 upstream/base/repo 三个 SHA 和结构化的
              #      冲突文件数组，外部（Hermes）不需要解析中文日志就能机读定位。
              #   4. JSON 必须由 jq 生成：git 对含引号/反斜杠的文件名会输出 C 风格转义，
              #      直接 printf 进 JSON 会产出非法文档（实测 JSON.parse 报错）。
              UPSTREAM_SHA="$(git rev-parse upstream/main)"
              BASE_SHA="$(git merge-base HEAD upstream/main)"
              BEFORE_SHA="$(git rev-parse HEAD)"
              TARGET_BRANCH="sync-conflict/${UPSTREAM_SHA:0:12}-${BEFORE_SHA:0:8}"
              MANIFEST_DIR="$(mktemp -d)"

              # 从这行起工作区可能被改写（commit、生成 manifest、push）。用 EXIT trap
              # 统一兜底恢复，而不是在每个失败分支各写一遍 reset —— 两种失败模式都栽过：
              #   A. jq 在运行时崩（不是缺失）时 `bash -e` 直接中断步骤，
              #      写在线性代码后面的 reset 永远执行不到，工作区留在冲突态；
              #   B. 进程替换里的内层 jq 失败不会让外层 jq 失败（pipefail 管不到
              #      process substitution），曾经产出 conflict_files:null 的假 manifest
              #      并照常推分支 —— 下游拿到「没有冲突」的现场，比不交接更难排查。
              # 现在只有一处恢复逻辑，任何退出路径都干净。
              restore_worktree() {
                git reset --hard "$BEFORE_SHA" >/dev/null 2>&1 || true
                rm -f .sync-conflict.json
                rm -rf "$MANIFEST_DIR" "$CONFLICTS_Z" 2>/dev/null || true
                echo "工作区已恢复到 ${BEFORE_SHA:0:12}"
              }
              trap restore_worktree EXIT

              # 生成并**校验**交接 manifest。拆成独立函数是因为它有两个必须
              # 单独失败的内部步骤，任何一步失败都不能让分支照推。
              write_manifest() {
                local files_json="$MANIFEST_DIR/conflict-files.json"
                local out="$MANIFEST_DIR/.sync-conflict.json"

                # 第 1 步：原始字节 -> JSON 数组，先落成真文件。
                # 用进程替换 <(jq ...) 时内层失败不会传出去，外层 jq 照常读到
                # 空文件并写出 conflict_files:null —— 这是实测踩到的假 manifest。
                if ! jq -Rs 'split("\u0000") | map(select(length>0))' \
                        "$CONFLICTS_Z" > "$files_json" 2> "$MANIFEST_DIR/jq.err"; then
                  echo "::warning::冲突文件数组生成失败：$(tr '\n' ' ' < "$MANIFEST_DIR/jq.err")"
                  return 1
                fi

                # 第 2 步：组装。requirements 是**声明**，不含任何可执行内容；
                # 真正执行约束的是解决方（.github/sync-conflict-handoff.md）。
                if ! jq -n \
                    --arg upstream_sha "$UPSTREAM_SHA" \
                    --arg base_sha "$BASE_SHA" \
                    --arg repo_sha_before "$BEFORE_SHA" \
                    --arg branch "$TARGET_BRANCH" \
                    --arg run_id "${GITHUB_RUN_ID:-}" \
                    --arg handoff_doc ".github/sync-conflict-handoff.md" \
                    --slurpfile files "$files_json" \
                    '{upstream_sha:$upstream_sha, base_sha:$base_sha,
                      repo_sha_before:$repo_sha_before, branch:$branch,
                      run_id:$run_id, handoff_doc:$handoff_doc,
                      conflict_files:$files[0],
                      requirements:[
                        "delete .sync-conflict.json before opening the resolution PR",
                        "do not execute scripts from this branch (postinstall/prepare included)",
                        "extra review for any .github/workflows/** change",
                        "never auto-merge; the resolution PR needs a human review"
                      ]}' > "$out" 2>> "$MANIFEST_DIR/jq.err"; then
                  echo "::warning::manifest 组装失败：$(tr '\n' ' ' < "$MANIFEST_DIR/jq.err")"
                  return 1
                fi

                # 第 3 步：校验产物本身，而不是相信 jq 的退出码。
                # conflict_files 必须是非空数组 —— 走到这里时一定还有未解决的冲突，
                # 空数组只能是生成链路的 bug（本次分支的根因）。
                if ! jq -e '
                    (.upstream_sha | type == "string" and length > 0) and
                    (.base_sha | type == "string" and length > 0) and
                    (.repo_sha_before | type == "string" and length > 0) and
                    (.branch | type == "string" and length > 0) and
                    (.conflict_files | type == "array" and length > 0)
                  ' "$out" >/dev/null 2>&1; then
                  echo "::warning::manifest 校验失败，实际内容：$(jq -c . "$out" 2>/dev/null | head -c 400)"
                  return 1
                fi
                return 0
              }

              if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
                # 两个输出都要发：Telegram 步骤和 Hermes 侧都按 conflict_upstream_sha
                # 判断「这条现场对应哪个上游版本」，只发 branch 会让这条路径和无冲突
                # 路径的输出形状不一致，调用方就得写两种分支。
                echo "conflict_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
                echo "conflict_upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
                echo "分支 $TARGET_BRANCH 已存在（同一上游版本 + 同一本地基线），跳过，不覆盖已有现场。"
              else
                # 先判断 jq 在不在：没有它就无法安全生成 manifest，宁可不交接也不写坏文件。
                if ! command -v jq >/dev/null 2>&1; then
                  echo "::warning::runner 上没有 jq，无法生成合法 manifest，本次不交接"
                elif ! write_manifest; then
                  # 生成或校验失败：不推分支。工作区由 EXIT trap 恢复，run 仍然失败。
                  echo "::warning::manifest 生成或校验失败，本次不交接"
                else
                  cp "$MANIFEST_DIR/.sync-conflict.json" .sync-conflict.json

                  if git add -A >/dev/null 2>&1 \
                     && git -c user.name="github-actions[bot]" \
                           -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                           commit -m "ci: sync-conflict handoff (upstream ${UPSTREAM_SHA:0:12})" >/tmp/commit.log 2>&1; then
                    MERGE_SHA="$(git rev-parse HEAD)"
                    # 用 git branch 指向合并提交，而不是 checkout 到它：checkout 会
                    # 清掉 MERGE_HEAD，交接提交就丢了上游那个父提交。
                    git branch "$TARGET_BRANCH" "$MERGE_SHA"
                    # 推送前先把 main 恢复干净；这里之后的任何失败都由 EXIT trap 收尾。
                    git reset --hard "$BEFORE_SHA" >/dev/null
                    if PUSH_ERR="$(git push origin "$TARGET_BRANCH" 2>&1)"; then
                      echo "conflict_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
                      echo "conflict_upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
                      echo "已将冲突现场推送到 $TARGET_BRANCH（合并父提交已保留），等待自动解决。"
                    else
                      echo "::warning::推送 $TARGET_BRANCH 失败：${PUSH_ERR}"
                      git branch -D "$TARGET_BRANCH" >/dev/null 2>&1 || true
                      echo "本地交接分支已清理，main 未受影响。"
                    fi
                  else
                    echo "::warning::无法建立交接提交：$(tail -n 3 /tmp/commit.log 2>/dev/null | tr '\n' ' ')"
                  fi
                fi
              fi
            fi
          fi
          # 正常路径清理临时文件；异常路径已由 EXIT trap 清过，rm 两次无副作用。
          rm -rf "$MANIFEST_DIR" "$CONFLICTS_Z"

      - name: Align README Bun version with package.json
        # We keep our own READMEs, but upstream's tests/toolchainVersion.test.ts
        # asserts they state the pinned Bun release. Follow package.json so a
        # upstream bump does not break CI.
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          BUN=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([0-9][0-9.]*\)".*/\1/p' package.json | head -n 1)
          if [ -z "$BUN" ]; then
            echo "::warning::No bun@X.Y.Z in packageManager; skipping README alignment."
            exit 0
          fi
          for f in README.md README_CN.md; do
            [ -f "$f" ] || continue
            if grep -q "\*\*Bun $BUN\*\*" "$f"; then
              echo "$f already states Bun $BUN."
              continue
            fi
            if grep -q '\*\*Bun [0-9][0-9.]*\*\*' "$f"; then
              perl -pi -e "s/\*\*Bun [0-9][0-9.]*\*\*/**Bun $BUN**/g" "$f"
              echo "Updated the Bun version in $f to $BUN."
              continue
            fi
            # No version line at all (upstream reworded it): write one, in the
            # Development section when it exists, at the end otherwise.
            if [ "$f" = "README.md" ]; then
              BUN_LINE="This project is built and tested with **Bun $BUN**, pinned in package.json and in CI."
              BUN_FALLBACK="**Bun $BUN** is the pinned toolchain for this project."
            else
              BUN_LINE="本项目使用 **Bun $BUN** 构建与测试，版本锁定在 package.json 与 CI 配置中。"
              BUN_FALLBACK="本项目使用 **Bun $BUN** 作为固定工具链。"
            fi
            export BUN_LINE BUN_FALLBACK
            perl -0pi -e 's/^(## (?:Development|开发命令)[^\n]*\n)/$1\n$ENV{BUN_LINE}\n/m' "$f"
            if ! grep -q "\*\*Bun $BUN\*\*" "$f"; then
              printf '\n%s\n' "$BUN_FALLBACK" >> "$f"
            fi
            echo "Added the Bun version line to $f."
          done
          if ! git diff --quiet -- README.md README_CN.md; then
            git add README.md README_CN.md
            git commit -m "docs(readme): follow the pinned Bun release"
          fi

      - name: Push updates
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          git push origin main
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "")
          if [ -n "$LATEST_TAG" ]; then
            # Force tag to point to the merge commit (not upstream's original commit)
            git tag -f "$LATEST_TAG" HEAD
            git push -f origin "refs/tags/${LATEST_TAG}"
          fi
          git push origin --tags --force

      - name: Prune obsolete sync-conflict branches
        # 按「可证状态」清理，不按天数：这些分支是未解决冲突的现场，本地没有副本，
        # 定时删除等于静默丢证据。只有下面三种状态之一成立时才删：
        #   1. 这条分支上的 PR 已合并（squash/rebase 合并也算，看 PR 状态而不是 git 祖先）
        #   2. 分支头已经在 origin/main 里（fast-forward / merge commit 合并）
        #   3. 分支对应的上游 SHA 已经在 origin/main 里（main 已被更新的同步追上）
        # 其余一律保留，并在 run summary 里列出来，避免「不知道还有几条待处理」。
        # 永远不删还开着 PR 的分支。
        # 用 !cancelled() 而不是 always()：取消的 run 不该动远端分支。
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 这个 step 用 !cancelled() 而不是 only-on-success，所以前一步可能没跑完。
          # 先确认仓库可用；不可用就直接退出，绝不在半成品状态下删分支。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::没有可用的 git 仓库，跳过分支清理"
            exit 0
          fi
          git fetch origin '+refs/heads/sync-conflict/*:refs/remotes/origin/sync-conflict/*' --prune --quiet || true
          git fetch origin 'main:refs/remotes/origin/main' --quiet || true

          BRANCHES="$(git ls-remote --heads origin 'refs/heads/sync-conflict/*' | sed 's|.*refs/heads/||' || true)"
          if [ -z "$BRANCHES" ]; then
            echo "没有 sync-conflict/* 分支，无需清理。"
            exit 0
          fi

          declare -a KEPT=() DELETED=()
          while IFS= read -r b; do
            [ -z "$b" ] && continue

            # PR 状态优先：merged 就删，有 open PR 就留（正在解决中）。
            # closed 但没合并的 PR 不构成保留理由，交给后面的 git 状态判断 ——
            # 否则一条被放弃的 PR 会让分支永远留着。
            PR_STATE="$(gh api "repos/$REPO/pulls?state=all&head=$OWNER:$b&per_page=10" \
              --jq '[.[] | {state, merged_at}] | if any(.merged_at != null) then "merged" elif any(.state == "open") then "open" else "none" end' 2>/dev/null || echo "none")"
            if [ "$PR_STATE" = "open" ]; then
              KEPT+=("$b|open PR")
              continue
            fi
            if [ "$PR_STATE" = "merged" ]; then
              DELETED+=("$b|PR merged")
              continue
            fi

            TIP="$(git rev-parse "refs/remotes/origin/$b" 2>/dev/null || true)"
            if [ -z "$TIP" ]; then
              KEPT+=("$b|fetch failed")
              continue
            fi
            if git merge-base --is-ancestor "$TIP" refs/remotes/origin/main 2>/dev/null; then
              DELETED+=("$b|contained in main")
              continue
            fi

            # manifest 里的 upstream_sha 进了 main，说明这次冲突要跟的上游状态
            # 已经由后来的同步解决了，现场过期。manifest 缺失时退回第二个父提交。
            UP="$(git show "refs/remotes/origin/$b:.sync-conflict.json" 2>/dev/null \
                  | jq -r '.upstream_sha // empty' 2>/dev/null || true)"
            if [ -z "$UP" ]; then
              UP="$(git rev-parse "$TIP^2" 2>/dev/null || true)"
            fi
            if [ -n "$UP" ] && git merge-base --is-ancestor "$UP" refs/remotes/origin/main 2>/dev/null; then
              DELETED+=("$b|upstream $({ echo "$UP"; } | cut -c1-12) already in main")
              continue
            fi

            KEPT+=("$b|pending")
          done <<< "$BRANCHES"

          for entry in "${DELETED[@]:-}"; do
            [ -z "$entry" ] && continue
            b="${entry%%|*}"
            why="${entry#*|}"
            if git push origin --delete "$b" >/dev/null 2>&1; then
              echo "已删除 $b（$why）"
            else
              echo "::warning::删除 $b 失败（$why），保留待下次重试"
              KEPT+=("$b|delete failed")
            fi
          done

          {
            echo "### sync-conflict/* 分支状态"
            echo
            echo "| 分支 | 状态 |"
            echo "| --- | --- |"
            for entry in "${KEPT[@]:-}"; do
              [ -z "$entry" ] && continue
              echo "| \`${entry%%|*}\` | 保留：${entry#*|} |"
            done
            for entry in "${DELETED[@]:-}"; do
              [ -z "$entry" ] && continue
              echo "| \`${entry%%|*}\` | 已删除：${entry#*|} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram notification on conflict
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          CONFLICT_BRANCH: ${{ steps.merge.outputs.conflict_branch }}
        run: |
          # 冲突现场已推成分支时，说明已交给自动解决流程，不再重复喊「请手动解决」。
          if [ -n "${CONFLICT_BRANCH:-}" ]; then
            STATUS_LINE="*状态:* 冲突已推送到分支 \`${CONFLICT_BRANCH}\`，交由自动解决流程处理。"
            ACTION_LINE="若自动修复未开 PR，请检查分支 \`${CONFLICT_BRANCH}\`。"
          else
            STATUS_LINE="*状态:* 自动合并失败，存在冲突！"
            ACTION_LINE="请及时拉取仓库手动解决冲突。"
          fi

          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            TEXT=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n```\n%s\n```\n\n%s\n\n%s' \
              "⚠️ *Cli-Proxy-API-Management-Center 同步冲突告警*" \
              "*仓库:* \`${{ github.repository }}\`" \
              "*上游:* \`router-for-me/Cli-Proxy-API-Management-Center\` (main)" \
              "$STATUS_LINE" \
              "*冲突文件列表:*" \
              "${CONFLICT_FILES}" \
              "🔗 [点击查看 GitHub Action 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              "$ACTION_LINE")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -d "parse_mode=Markdown")
            echo "Telegram API Response: ${RESPONSE}"
          else
            echo "::warning::TG_BOT_TOKEN (or TELEGRAM_BOT_TOKEN) / TG_CHAT_ID (or TELEGRAM_CHAT_ID) is not configured in repository secrets."
          fi
          exit 1
