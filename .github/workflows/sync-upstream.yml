name: Sync Upstream

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git || true
          git fetch upstream main --tags --force

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_HEAD" = "$BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date with upstream/main."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in upstream/main."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          echo "Attempting to merge upstream/main..."
          if git merge upstream/main --no-edit -m "chore: sync upstream changes"; then
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "Merged upstream/main successfully."
          else
            echo "Merge conflict detected. Checking conflicting files..."
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                *SponsorQuickStart*|*quickStart*)
                  # 赞助商卡片专属文件：直接强制删除，不保留任何版本
                  echo "Auto-discarding upstream sponsor component: $f"
                  git rm -f "$f" 2>/dev/null || true
                  ;;
                README.md|README_CN.md|assets/*)
                  # 文档/广告图片：保留我方去广告版本
                  echo "Auto-resolving doc/ad conflict by keeping our clean version: $f"
                  git checkout --ours -- "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  ;;
              esac
            done

            REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -z "$REMAINING_CONFLICTS" ]; then
              git commit --no-edit -m "chore: sync upstream changes (auto-preserve ad-free docs)"
              echo "conflict=false" >> $GITHUB_OUTPUT
              echo "All conflicts were in docs/ad files and auto-resolved successfully."
            else
              echo "conflict=true" >> $GITHUB_OUTPUT
              echo "conflict_files=$REMAINING_CONFLICTS" >> $GITHUB_OUTPUT
              echo "Unresolved code conflicts in: $REMAINING_CONFLICTS"
              git merge --abort || true
            fi
          fi

      - name: Push updates
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          git push origin main
          git push origin --tags --force

      - name: Trigger Release Build
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "")
          echo "Triggering release build for tag: ${LATEST_TAG:-latest}..."
          if [ -n "$LATEST_TAG" ]; then
            gh workflow run release.yml -f tag_name="$LATEST_TAG" || echo "Workflow trigger failed or already queued"
          else
            gh workflow run release.yml || echo "Workflow trigger failed or already queued"
          fi

      - name: Send Telegram notification on conflict
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            TEXT=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n```\n%s\n```\n\n%s\n\n%s' \
              "⚠️ *Cli-Proxy-API-Management-Center 同步冲突告警*" \
              "*仓库:* \`${{ github.repository }}\`" \
              "*上游:* \`router-for-me/Cli-Proxy-API-Management-Center\` (main)" \
              "*状态:* 自动合并失败，存在冲突！" \
              "*冲突文件列表:*" \
              "${CONFLICT_FILES}" \
              "🔗 [点击查看 GitHub Action 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              "请及时拉取仓库手动解决冲突。")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -d "parse_mode=Markdown")
            echo "Telegram API Response: ${RESPONSE}"
          else
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured in repository secrets."
          fi
          exit 1
