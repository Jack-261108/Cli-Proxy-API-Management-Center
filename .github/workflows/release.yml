name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank for latest tag)'
        required: false
        default: ''

concurrency:
  group: release-${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag and version
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "v1.22.16")
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all-in-one HTML
        run: bun run build
        env:
          VERSION: ${{ steps.vars.outputs.tag }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${{ steps.vars.outputs.tag }}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          # Bound the changelog to the commits between the previous tag and this
          # one. Without a range the log is just "the last 20 commits", which
          # drifts on every sync and has nothing to do with what this tag
          # actually changed. Fall back to the whole history when there is no
          # previous tag, or when the computed range cannot be resolved.
          if [ -n "${previous_tag}" ] && git rev-parse --verify -q "${previous_tag}^{commit}" >/dev/null; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          # `git rev-parse --verify` does NOT accept a range: it prints HEAD but
          # exits 1, so verifying `A..B` that way would reject every valid range
          # and silently fall back to the old "last 20 commits" behaviour.
          # `rev-list --count` is the correct probe (it resolves the range and
          # reports 0 for an empty-but-valid range).
          if ! git rev-list --count "${range}" >/dev/null 2>&1; then
            range="HEAD"
          fi
          echo "Release notes range: ${range}"

          : > release-notes.md
          echo "## Release ${current_tag}" >> release-notes.md
          echo "" >> release-notes.md
          echo "Web UI 单文件构建产物（已移除快速开始页面）。" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 变更记录" >> release-notes.md
          if ! git log --pretty=format:"- %h %s" -n 20 "${range}" >> release-notes.md; then
            # Range resolved but the log failed: never fail the release over
            # changelog formatting, just fall back to the recent commits.
            echo "- (range ${range} 无法读取，以下为最近提交)" >> release-notes.md
            git log --pretty=format:"- %h %s" -n 20 HEAD >> release-notes.md || true
          fi
          echo "" >> release-notes.md

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
